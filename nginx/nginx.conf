user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format json_combined escape=json
      '{'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host"'
      '}';

    access_log /var/log/nginx/access_json.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream course_api {
        server course-api:3000;
    }

    upstream student_api {
        server student-api:3000;
    }

    upstream portal {
        server portal:3000;
    }

    upstream terminal_ws {
        server terminal-ws:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/course/ {
            proxy_pass http://course_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/student/ {
            proxy_pass http://student_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/terminal {
            proxy_pass http://terminal_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Admin 容器尚未接入，先回應暫時頁面；就緒後改為 proxy_pass http://admin:3000;
        location /admin {
            default_type text/plain;
            return 200 "admin frontend not wired yet.\n";
        }

        location / {
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
