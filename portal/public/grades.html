    border-bottom: 1px solid #ddd;

    display: flex;

    justify-content: center;

.nav a {
    padding: 17px 25px;

    text-decoration: none;

    color: #333;

    padding-bottom: 50px;

.gpa-label {

/* CARD */

.card {

    border: 1px solid #e5e0d5;

    margin-bottom: 20px;

/* TABLE */

.table-wrapper {
    overflow-x: auto;

table {

    border-collapse: collapse;

th {

    color: #705c2d;

    font-size: 12px;

td {

    color: white;

    text-align: center;

<main class="container">

<h1 class="title">
成績查詢
</h1>


<div class="gpa">

<div class="gpa-number" id="gpaNumber">
—
</div>

<div class="gpa-label" id="gpaLabel">
總平均 GPA
</div>

</div>



<div class="card">

<h2 style="color:#594b2d;margin-bottom:20px;" id="currentSemesterTitle">
成績列表
</h2>


<div class="table-wrapper">

<table>

<thead>

<tr>

<th>課程</th>
<th>學分</th>
<th>成績</th>
<th>等第</th>

</tr>

</thead>


<tbody id="gradesBody">

<tr><td colspan="4">載入中...</td></tr>

</tbody>

</table>

</div>

</div>



<div class="card">

<h2 style="color:#594b2d;margin-bottom:20px;">
各學期統計
</h2>


<div class="table-wrapper">

<table>

<thead>

<tr>

<th>學期</th>
<th>修課學分</th>
<th>學期 GPA</th>
<th>累計學分</th>

</tr>

</thead>


<tbody id="semesterSummaryBody">

<tr><td colspan="4">載入中...</td></tr>

</tbody>

</table>

<footer>

<h3>
Campus Portal
</h3>

<p>
校園資訊服務平台
</p>

</footer>



<script src="api.js"></script>
<script>

const user = requireLogin();

function weightedGpa(courses) {

    const scored = courses.filter(function(c) { return c.score !== null && c.score !== undefined; });

    if (scored.length === 0) return null;

    const totalCredits = scored.reduce(function(sum, c) { return sum + c.credits; }, 0);
    const totalPoints = scored.reduce(function(sum, c) {
        return sum + scoreToGpaPoint(c.score) * c.credits;
    }, 0);

    return totalCredits === 0 ? null : totalPoints / totalCredits;

}

async function loadGrades() {

    const gradesBody = document.getElementById("gradesBody");
    const summaryBody = document.getElementById("semesterSummaryBody");

    try {

        const courses = await apiFetch(`/student/${user.id}/courses`);

        if (courses.length === 0) {
            gradesBody.innerHTML = '<tr><td colspan="4">目前沒有成績資料</td></tr>';
            summaryBody.innerHTML = '<tr><td colspan="4">目前沒有成績資料</td></tr>';
            document.getElementById("gpaNumber").textContent = "—";
            return;
        }

        // 成績列表
        gradesBody.innerHTML = courses.map(function(c) {
            return "<tr>" +
                "<td>" + c.name + "</td>" +
                "<td>" + c.credits + "</td>" +
                "<td>" + formatScore(c.score) + "</td>" +
                "<td>" + scoreToLetter(c.score) + "</td>" +
                "</tr>";
        }).join("");

        // 總平均 GPA（學分加權）
        const overallGpa = weightedGpa(courses);
        document.getElementById("gpaNumber").textContent =
            overallGpa === null ? "—" : overallGpa.toFixed(2);

        // 依學期分組，算每學期修課學分 / 學期 GPA / 累計學分
        const bySemester = {};
        courses.forEach(function(c) {
            const key = c.semester || "未分類";
            if (!bySemester[key]) bySemester[key] = [];
            bySemester[key].push(c);
        });

        const semesters = Object.keys(bySemester).sort();
        let cumulative = 0;

        summaryBody.innerHTML = semesters.map(function(sem) {
            const list = bySemester[sem];
            const credits = list.reduce(function(sum, c) { return sum + c.credits; }, 0);
            cumulative += credits;
            const gpa = weightedGpa(list);

            return "<tr>" +
                "<td>" + sem + "</td>" +
                "<td>" + credits + "</td>" +
                "<td>" + (gpa === null ? "—" : gpa.toFixed(2)) + "</td>" +
                "<td>" + cumulative + "</td>" +
                "</tr>";
        }).join("");

    } catch (err) {

        gradesBody.innerHTML = '<tr><td colspan="4">載入失敗：' + err.message + "</td></tr>";
        summaryBody.innerHTML = "";

    }

}

loadGrades();

</script>
