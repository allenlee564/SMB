    color: white;

    padding: 7px 13px;

    border-radius: 5px;

    cursor: pointer;
}

.button:hover {

}

.button.done {
    background: #5d825e;

}

.button.full {

footer {
    background: #4c4538;

<main class="container">

<h1 class="title">
網路選課
</h1>


<div class="card">

<h2 style="color:#594b2d;margin-bottom:20px;">
開放課程
</h2>


<div class="table-wrapper">

<table>

<thead>

<tr>

<th>課程名稱</th>
<th>教師</th>
<th>學分</th>
<th>操作</th>

</tr>

</thead>

<tr><td colspan="4">載入中...</td></tr>

Campus Portal
</h3>

<p>
校園資訊服務平台
</p>

</footer>



<script src="api.js"></script>
<script>

const user = requireLogin();
let enrolledIds = new Set();

async function enroll(button, courseId) {

    button.disabled = true;

    try {

        await apiFetch(`/student/${user.id}/courses`, {
            method: "POST",
            body: JSON.stringify({ course_id: courseId }),
        });

        enrolledIds.add(courseId);
        button.textContent = "已加選";
        button.classList.add("done");

    } catch (err) {

        if (err.status === 409) {
            // 已經選過了，畫面同步成「已加選」
            enrolledIds.add(courseId);
            button.textContent = "已加選";
            button.classList.add("done");
        } else {
            alert("加選失敗：" + err.message);
            button.disabled = false;
        }

    }

}

function renderCourse(c) {

    const done = enrolledIds.has(c.id);

    const actionHtml = done
        ? '<button class="button done" disabled>已加選</button>'
        : '<button class="button" onclick="enroll(this,' + c.id + ')">加選</button>';

    return "<tr>" +
        "<td>" + c.name + "</td>" +
        "<td>" + (c.teacher || "—") + "</td>" +
        "<td>" + c.credits + "</td>" +
        "<td>" + actionHtml + "</td>" +
        "</tr>";

}

async function loadCourses() {

    const tbody = document.getElementById("courseListBody");

    try {

        const [allCourses, myCourses] = await Promise.all([
            apiFetch("/course/list"),
            apiFetch(`/student/${user.id}/courses`),
        ]);

        enrolledIds = new Set(myCourses.map(function(c) { return c.id; }));

        if (allCourses.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">目前沒有開放課程</td></tr>';
            return;
        }

        tbody.innerHTML = allCourses.map(renderCourse).join("");

    } catch (err) {

        tbody.innerHTML = '<tr><td colspan="4">載入失敗：' + err.message + "</td></tr>";

    }

}

loadCourses();

</script>
